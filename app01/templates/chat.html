{% extends "new_layout_2.html" %}
{% load static %}
{% block css  %}
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

{% endblock %}



{% block title %}<i class="fa fa-weibo"></i> 微博热搜分析平台{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <div class="ibox float-e-margins">
            <div class="ibox-title">
                <h5>微博热搜事件分析平台</h5>
                <div class="ibox-tools">
                    <a class="collapse-link">
                        <i class="fa fa-chevron-up"></i>
                    </a>
                </div>
            </div>
            <div class="ibox-content">
                <div class="alert alert-info">
                    <h3>分析维度说明</h3>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <div class="row">
                                <div class="col-md-1">📌</div>
                                <div class="col-md-11">事件起源与发展脉络</div>
                            </div>
                        </li>
                        <li class="list-group-item">
                            <div class="row">
                                <div class="col-md-1">📊</div>
                                <div class="col-md-11">舆情数据与传播路径</div>
                            </div>
                        </li>
                        <li class="list-group-item">
                            <div class="row">
                                <div class="col-md-1">💬</div>
                                <div class="col-md-11">网民观点聚类分析</div>
                            </div>
                        </li>
                        <li class="list-group-item">
                            <div class="row">
                                <div class="col-md-1">📈</div>
                                <div class="col-md-11">影响力评估与趋势预测</div>
                            </div>
                        </li>
                    </ul>
                </div>

                <form id="chatForm" class="mt-4">
                    {% csrf_token %}
                    <div class="form-group">
                        <label class="control-label">热搜事件</label>
                        <textarea
                            id="query"
                            name="query"
                            rows="5"
                            class="form-control"
                            placeholder="请输入热搜事件（示例：'某明星演唱会疑似假唱引发争议'）..."
                        ></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        开始专业分析
                        <span class="fa fa-spinner fa-spin fa-fw d-none"></span>
                    </button>
                </form>

                <div id="response" class="mt-4">
                    <div class="panel panel-default">
                        <div class="panel-body">
                            <div class="alert alert-secondary">
                                请输入热搜事件后点击分析按钮
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function formatContent(text) {
        return text
            .replace(/【(.*?)】/g, '<span class="text-danger">$1</span>')
            .replace(/(\d+\.)/g, '<strong class="text-dark">$1</strong>')
            .replace(/\n/g, '<br>')
            .replace(/（/g, '<em>（')
            .replace(/）/g, '）</em>');
    }

    document.getElementById('chatForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = this.querySelector('button');
        const responseDiv = document.getElementById('response');

        responseDiv.innerHTML = '<div class="panel panel-default"><div class="panel-body"><div class="alert alert-info">分析进行中，请稍候...</div></div></div>';
        btn.disabled = true;
        btn.querySelector('.fa-spinner').classList.remove('d-none');

        try {
            const formData = new FormData(this);
            const response = await fetch("{% url 'get_gpt_answer' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            const data = await response.json();
            if (response.ok) {
                if (data.task_id) {
                    await pollAnswer(data.task_id, responseDiv);
                } else {
                    responseDiv.innerHTML = `<div class="panel panel-default"><div class="panel-body"><div class="alert alert-danger">${data.error}</div></div></div>`;
                }
            }
        } catch (err) {
            responseDiv.innerHTML = `<div class="panel panel-default"><div class="panel-body"><div class="alert alert-danger">网络请求失败：${err.message}</div></div></div>`;
        } finally {
            btn.disabled = false;
            btn.querySelector('.fa-spinner').classList.add('d-none');
        }
    });

    async function pollAnswer(task_id, responseDiv) {
        try {
            const response = await fetch(`/get_answer/?task_id=${task_id}`);
            const data = await response.json();

            if (data.content) {
                responseDiv.innerHTML = `
                    <div class="panel panel-default">
                        <div class="panel-body">
                            ${formatContent(data.content)}
                        </div>
                    </div>
                `;
                responseDiv.scrollTop = responseDiv.scrollHeight;
            }

            if (!data.complete) {
                await new Promise(resolve => setTimeout(resolve, 800));
                await pollAnswer(task_id, responseDiv);
            }
        } catch (err) {
            responseDiv.innerHTML = `<div class="panel panel-default"><div class="panel-body"><div class="alert alert-danger">轮询失败：${err.message}</div></div></div>`;
        }
    }
</script>
{% endblock %}
