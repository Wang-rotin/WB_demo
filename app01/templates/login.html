{% load static %}
<html>
{% block css %}

{% endblock %}
<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
        }

        /* CSS 渐变背景样式 */
        #gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: gradientBackground 10s ease infinite;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            z-index: -3;
        }

        @keyframes gradientBackground {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* SVG 波浪背景样式 */
        svg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        /* 粒子背景样式 */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 内容区域样式 */
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding-top: 20vh;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
    <title>Dynamic Background with CSS</title>
</head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">

    <title>系统登录</title>

    <link href="../static/css/bootstrap.min.css?v=3.4.0" rel="stylesheet">
    <link href="../static/font-awesome/css/font-awesome.css?v=4.3.0" rel="stylesheet">

    <link href="../static/css/animate.css" rel="stylesheet">

</head>

<body class="gray-bg">
<div style="font-family:'SimSun';font-size:70px;color:white;margin-top:50px;margin-left:70px;">欢迎使用基于大语言模型的
</div>

        <div>
            <h1 class="logo-name">wb</h1>
        </div>
        <form class="m-t" role="form" action="/login/" method="post">

            </div>
            <div class="form-group">
                <input type="email" class="form-control" placeholder="电子邮件" required="" name="email">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" placeholder="密码" required="" name="password">
            </div>
            <button type="submit" class="btn btn-primary block full-width m-b">登 录</button>
            <p style="color: red;text-align: center">{{ error_msg }}</p>
            <p class="text-muted text-center"><a href="/register/"><small>忘记密码了？</small></a> | <a
                    href="/register/">注册一个新账号</a>

    <!-- 引入 particles.js 库 -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // 初始化粒子效果
        particlesJS.load('particles-js', {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,

                },
                "opacity": {
                    "value": 0.5,

                    "anim": {
                        "enable": false,

                        "opacity_min": 0.1,
                        "sync": false

                    "value": 3,

                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1

                "move": {

                    "direction": "none",

                    "remove": {

                }
            },
            "retina_detect": true
        });
